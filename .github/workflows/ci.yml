name: CI - Message

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Esperanca.Message/Esperanca.Message.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts